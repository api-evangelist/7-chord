aid: 7-chord
name: 7 Chord
description: 7 Chord is a New York-based financial technology company providing AI-driven,
  real-time pricing and analytics for fixed income (corporate bond) markets. Its flagship
  engine, BondDroid, ingests 100 million-plus data points per day - firm and indicative
  quotes, post-trade prints, and macro and country risk factors - and distills them
  into risk-neutral bid, ask, and mid prices, yields, and option-adjusted spreads,
  including for thinly traded bonds. Founded in 2017, 7 Chord delivers BondDroid pricing
  in streaming, delayed, and historical bulk formats, and can run behind a client's
  firewall so proprietary data never leaves their environment. Its pricing powers platforms
  including Broadridge's LTX, TS Imagine, and PortfolioBI, and is distributed through
  partners such as Bonds.com and Dewey Data.
